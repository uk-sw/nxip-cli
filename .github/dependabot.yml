# Weekly dependency updates, grouped so a quiet week is one PR. Security
# advisories still arrive as their own PR immediately (AGENTS.md, "Writing
# code"). Nothing here publishes: a tag does, and only Sonny tags.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
