name: Release

# Publishing is tag-triggered, and uses npm trusted publishing (OIDC) rather
# than a stored NPM_TOKEN. GitHub mints a short-lived credential per run, so
# there is no long-lived secret in repository settings to leak or rotate, and
# no 90-day granular-token expiry to remember every quarter.
#
# This requires a one-time setup that cannot be done from here, because npm
# will only accept a trusted-publisher configuration for a package that
# already exists:
#
#   1. Publish once by hand:  npm login && npm publish
#   2. On npmjs.com, package settings -> Trusted Publisher -> GitHub Actions,
#      repository uk-sw/nxip-cli, workflow release.yml
#   3. Every release after that is just: bump version, tag, push
#
# To cut a release: bump the version in package.json, commit, then
# `git tag v0.2.1 && git push --tags`.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required, and load-bearing: this is what authenticates the publish
      # under trusted publishing, as well as what lets npm record a verified
      # link back to the commit and workflow that produced the tarball.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1. CI
          # tests on 20; this job is the publisher, not a compatibility
          # check, so it deliberately runs newer.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 still ships npm 10.x, which cannot do OIDC publishing at all,
      # and the failure it gives is not obvious. Pinning the npm version
      # explicitly makes this independent of whatever npm the Node image
      # happens to bundle.
      - run: npm install -g npm@latest

      - run: npm ci

      # The same gates CI runs. A tag must not be able to publish something
      # that would have failed on main.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Refuse to publish a tag that disagrees with package.json, which is
      # the easiest release mistake to make and the most confusing to debug
      # afterwards.
      - name: Check the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME implies version $TAG_VERSION, but package.json says $PKG_VERSION."
            exit 1
          fi
          echo "Publishing $PKG_VERSION"

      # No NODE_AUTH_TOKEN. Authentication comes from the OIDC token minted
      # by the id-token permission above, which is why that permission is
      # required rather than merely nice for provenance.
      - run: npm publish --provenance --access public

  # The nxip-agent container: the same CLI, installed from the package the
  # job above just published, so the image and the npm release of one tag
  # are one artefact. Pushed to GitHub's own registry with the repository's
  # GITHUB_TOKEN, so there is no new secret (docs/specs/nxip-agent-cisco.md).
  image:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # npm serves a fresh version's metadata before its tarball for a few
      # minutes after publish, and `npm install` in the build would meet the
      # 404 and fail the whole release. Poll the tarball URL until it is
      # there, up to ten minutes, before building.
      # The tag is v0.15.0; the package, the image tag and the version the
      # image prints are all 0.15.0.
      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for the published tarball to be downloadable
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://registry.npmjs.org/nxip-cli/-/nxip-cli-${VERSION}.tgz"
          for attempt in $(seq 1 60); do
            if curl -sSfI "$URL" > /dev/null; then
              echo "nxip-cli@${VERSION} is downloadable"
              exit 0
            fi
            echo "attempt ${attempt}: not yet at ${URL}"
            sleep 10
          done
          echo "nxip-cli@${VERSION} never became downloadable"
          exit 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NXIP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/uk-sw/nxip-agent:${{ steps.version.outputs.version }}
            ghcr.io/uk-sw/nxip-agent:latest

      # The image is only a release if it runs. Pulling what was just pushed
      # and asking for the version is the check the spec names.
      - name: Smoke test the image
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PRINTED="$(docker run --rm "ghcr.io/uk-sw/nxip-agent:${VERSION}" --version)"
          if [ "$PRINTED" != "$VERSION" ]; then
            echo "Image printed version '$PRINTED', expected '$VERSION'."
            exit 1
          fi
          echo "ghcr.io/uk-sw/nxip-agent:${VERSION} prints ${PRINTED}"
